const synth = window.speechSynthesis;

// Speech with pauses at punctuation: text is split into chunks at , ; : – — . ! ? and each chunk is
// spoken as its own utterance; a silent gap (setTimeout) follows each chunk (short for commas, longer for sentence ends).
const PAUSE = { ',': 100, ';': 250, ':': 250, '–': 250, '—': 250, '.': 300, '!': 300, '?': 300 };
const SENTENCE_GAP = 650;
let speechToken = 0;

function germanVoice() {
  return synth.getVoices().find(v => v.lang && v.lang.replace('_','-').toLowerCase().startsWith('de'));
}
function chunks(text) {
  const out = [];
  const re = /([^,;:–—.!?]+)([,;:–—.!?„“"»«]*)/g;
  let m;
  while ((m = re.exec(text))) {
    const words = m[1].replace(/[„“"»«]/g, '').trim();
    const punct = (m[2].match(/[,;:–—.!?]/g) || []).pop();
    if (words) out.push({ text: words, pause: punct ? PAUSE[punct] : 0 });
    else if (punct && out.length) out[out.length - 1].pause = Math.max(out[out.length - 1].pause, PAUSE[punct]);
  }
  return out;
}
function speakQueue(items) {   // items: [{text, pause}]
  const token = ++speechToken;
  const v = germanVoice();
  let i = 0;
  (function next() {
    if (token !== speechToken || i >= items.length) return;
    const it = items[i++];
    const u = new SpeechSynthesisUtterance(it.text);
    u.lang = 'de-DE'; if (v) u.voice = v; u.rate = 0.85;
    const go = () => setTimeout(next, it.pause);
    u.onend = go; u.onerror = go;
    synth.speak(u);
  })();
}
function speak(text) {
  if (!synth) { alert('Speech is not supported in this browser.'); return; }
  synth.cancel();
  speakQueue(chunks(text));
}
if (synth) synth.getVoices();

// speak the whole story: sentence by sentence, with pauses at punctuation and a longer gap between sentences
function speakAll() {
  if (!synth) { alert('Speech is not supported in this browser.'); return; }
  synth.cancel();
  const items = [];
  STORY.sentences.forEach(s => {
    const c = chunks(s.de);
    if (c.length) c[c.length - 1].pause = Math.max(c[c.length - 1].pause, SENTENCE_GAP);
    items.push(...c);
  });
  speakQueue(items);
}
document.getElementById('playAll').addEventListener('click', e => { e.stopPropagation(); speakAll(); });

function showPop(anchor, html) {
  pop.innerHTML = html;
  pop.style.display = 'block';
  const r = anchor.getBoundingClientRect();
  const left = Math.max(8, Math.min(r.left + scrollX, scrollX + innerWidth - pop.offsetWidth - 8));
  pop.style.left = left + 'px';
  pop.style.top = (r.bottom + scrollY + 6) + 'px';
}
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function btn(label, title, fn) {
  const b = document.createElement('button');
  b.className = 'ic'; b.textContent = label; b.title = title;
  b.addEventListener('click', e => { e.stopPropagation(); fn(b); });
  return b;
}

const main = document.getElementById('story');
STORY.sentences.forEach(s => {
  const p = document.createElement('span');
  p.className = 's';
  p.appendChild(btn('🔊', 'Satz anhören / Hear sentence', () => speak(s.de)));
  p.appendChild(btn('💬', 'English', b => showPop(b, esc(s.en))));
  // split into words (letters incl. umlauts/ß, apostrophes/hyphens inside) and everything else
  s.de.split(/([A-Za-zÄÖÜäöüß]+(?:[-'][A-Za-zÄÖÜäöüß]+)*)/).forEach(part => {
    if (!part) return;
    if (/^[A-Za-zÄÖÜäöüß]/.test(part)) {
      const key = part.toLowerCase();
      const en = STORY.glossary[key];
      if (en === undefined) console.warn('Missing glossary entry:', key);
      const w = document.createElement('span');
      w.className = 'w'; w.textContent = part;
      w.addEventListener('click', e => {
        e.stopPropagation();
        showPop(w, '<span class="de">' + esc(part) + '</span> = ' + esc(en ?? '(no translation)') + ' ');
        const sp = btn('🔊', 'Wort anhören / Hear word', () => speak(part));
        pop.appendChild(sp);
      });
      p.appendChild(w);
    } else {
      p.appendChild(document.createTextNode(part));
    }
  });
  main.appendChild(p);
});

// quiz: clicking an option reveals the correct answer with a green tick

  STORY.questions.forEach((qq, i) => {
    const box = document.createElement('div'); box.className = 'q';
    const p = document.createElement('p'); p.textContent = (i + 1) + '. ' + qq.q; box.appendChild(p);
    const btns = qq.options.map((o, j) => {
      const b = document.createElement('button'); b.className = 'opt'; b.textContent = o;
      b.addEventListener('click', e => {
        e.stopPropagation();
        btns.forEach((x, k) => {
          x.disabled = true;
          if (k === qq.answer) { x.classList.add('correct'); x.insertAdjacentHTML('afterbegin', '<span class="tick">✔</span>'); }
        });
        if (j !== qq.answer) b.classList.add('wrong');
      });
      box.appendChild(b); return b;
    });
    quiz.appendChild(box);
  });
}

document.addEventListener('click', () => { pop.style.display = 'none'; });
pop.addEventListener('click', e => e.stopPropagation());
