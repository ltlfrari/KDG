<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Max im Park</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lora:ital@0;1&display=swap" rel="stylesheet">
  <style>
    body { margin:0; padding:0 16px 4rem; background:#faf6ee; color:#2b2b2b; font-family:"Lora",Georgia,serif; }
    header { text-align:center; padding:2rem 0 1rem; }
    h1 { font-family:"Playfair Display",Georgia,serif; font-size:2.5rem; margin:0 0 .4rem; }
    .sub { font-style:italic; font-size:1.25rem; color:#6b5b4b; margin:0; }
    .lvl { display:inline-block; margin:.6rem 0 0; font-size:.95rem; font-weight:bold; color:#6b3f1d; background:#f1dfb8; border-radius:999px; padding:.1rem .8rem; }
    .back { display:block; text-align:center; margin:.5rem 0 1.5rem; color:#6b5b4b; }
    main { max-width:42rem; margin:0 auto; font-size:1.3rem; line-height:2.2; }
    .s { display:block; margin-bottom:.6rem; }
    .ic { cursor:pointer; border:0; background:none; font-size:1.05rem; padding:0 .2rem; vertical-align:middle; }
    .ic:hover { transform:scale(1.2); }
    .all { display:block; margin:0 auto 1rem; font-size:1.1rem; cursor:pointer; border:1px solid #c9b79c; background:#fff; border-radius:999px; padding:.3rem 1rem; }
    .all:hover { background:#f1dfb8; }
    #quiz { max-width:42rem; margin:2.5rem auto 0; font-size:1.15rem; }
    #quiz h2 { font-family:"Playfair Display",Georgia,serif; text-align:center; }
    .q { margin:1.4rem 0; }
    .q p { font-weight:bold; margin:0 0 .4rem; }
    .opt { display:block; width:100%; text-align:left; font:inherit; cursor:pointer; background:#fff; border:1px solid #c9b79c; border-radius:8px; padding:.45rem .8rem; margin:.3rem 0; }
    .opt:hover:not(:disabled) { background:#f1dfb8; }
    .opt:disabled { cursor:default; color:inherit; }
    .opt.correct { border-color:#2e9e4f; background:#eaf7ee; }
    .opt.wrong { border-color:#c0392b; background:#fbeaea; }
    .tick { color:#2e9e4f; font-weight:bold; margin-right:.4rem; }
    .w { cursor:pointer; border-radius:4px; padding:0 1px; }
    .w:hover { background:#f1dfb8; }
    #pop { position:absolute; z-index:10; display:none; background:#fff; border:1px solid #c9b79c;
           border-radius:8px; box-shadow:0 4px 14px rgba(0,0,0,.2); padding:.6rem .8rem;
           font-size:1.05rem; line-height:1.5; max-width:min(22rem,86vw); }
    #pop .de { font-weight:bold; margin-right:.3rem; }
    @media (max-width:480px){ h1{font-size:1.8rem;} main{font-size:1.15rem;} }
  </style>
</head>
<body>
  <header>
    <h1>Max im Park</h1>
    <p class="sub">Max in the Park</p>
    <p class="lvl" id="lvl"></p>
  </header>
  <a class="back" href="index.html">&larr; Alle Geschichten / All stories</a>
  <button class="all" id="playAll" title="Ganze Geschichte anhören / Hear whole story">🔊 Ganze Geschichte / Whole story</button>
  <main id="story"></main>
  <section id="quiz"></section>
  <div id="pop"></div>

<script>
/* ===== STORY DATA (edit this block when updating a story) ===== */
const STORY = {
  level: "B1",
  titleDe: "Max im Park",
  titleEn: "Max in the Park",
  sentences: [
    {"de":"Tom hat seit zwei Jahren einen Hund, der Max heißt.","en":"Tom has had a dog called Max for two years."},
    {"de":"Weil das Wetter heute so schön ist, möchte er mit ihm in den Park gehen.","en":"Because the weather is so nice today, he wants to go to the park with him."},
    {"de":"Als sie ankommen, sind dort schon viele Kinder, die spielen und lachen.","en":"When they arrive, there are already many children there, playing and laughing."},
    {"de":"Ein Mädchen wirft einen roten Ball, aber es wirft ihn zu weit.","en":"A girl throws a red ball, but she throws it too far."},
    {"de":"Max sieht den Ball und läuft sofort los, obwohl Tom ihn ruft.","en":"Max sees the ball and runs off immediately, although Tom calls him."},
    {"de":"Er springt hoch in die Luft und fängt den Ball mit dem Maul.","en":"He jumps high into the air and catches the ball in his mouth."},
    {"de":"Das Mädchen freut sich so sehr, dass es laut „Bravo!“ ruft.","en":"The girl is so happy that she shouts \"Bravo!\" loudly."},
    {"de":"Alle anderen Kinder klatschen, und Tom ist stolz auf seinen Hund.","en":"All the other children clap, and Tom is proud of his dog."},
    {"de":"Danach spielen sie zusammen mit Max, bis es dunkel wird.","en":"Afterwards they play together with Max until it gets dark."},
    {"de":"Am Abend gehen Tom und Max müde nach Hause.","en":"In the evening, Tom and Max go home tired."},
    {"de":"Max legt sich auf das Sofa und schläft sofort ein.","en":"Max lies down on the sofa and falls asleep immediately."},
    {"de":"Tom lächelt und sagt leise: „Du warst heute ein richtiger Held.“","en":"Tom smiles and says quietly: \"You were a real hero today.\""}
  ],
  questions: [
    {"q":"Warum gehen Tom und Max in den Park?","options":["Weil das Wetter schön ist","Weil Max krank ist","Weil Tom Freunde besuchen muss"],"answer":0},
    {"q":"Was macht Max, als das Mädchen den Ball zu weit wirft?","options":["Er bleibt bei Tom","Er läuft los und fängt den Ball","Er bellt die Kinder an"],"answer":1},
    {"q":"Wie reagieren die anderen Kinder?","options":["Sie gehen weg","Sie lachen Max aus","Sie klatschen"],"answer":2},
    {"q":"Was sagt Tom am Ende zu Max?","options":["Er sei ein schlechter Hund","Er sei heute ein Held gewesen","Er müsse morgen zu Hause bleiben"],"answer":1}
  ],
  glossary: {
    "tom": "Tom (name)",
    "sind": "are",
    "hat": "has",
    "seit": "for / since",
    "zwei": "two",
    "jahren": "years",
    "einen": "a (masc., accusative)",
    "hund": "dog",
    "der": "the (masc.) / who (relative)",
    "max": "Max (name)",
    "heißt": "is called",
    "weil": "because",
    "das": "the (neut.)",
    "wetter": "weather",
    "heute": "today",
    "so": "so",
    "schön": "nice / beautiful",
    "ist": "is",
    "möchte": "would like to / wants to",
    "er": "he",
    "mit": "with",
    "ihm": "him",
    "in": "in / into",
    "den": "the (masc., accusative)",
    "park": "park",
    "gehen": "go",
    "als": "when (past/single event)",
    "sie": "they / she",
    "ankommen": "to arrive",
    "dort": "there",
    "schon": "already",
    "viele": "many",
    "kinder": "children",
    "die": "the (fem./plural) / who (relative)",
    "spielen": "play",
    "und": "and",
    "lachen": "laugh",
    "ein": "a / in (einschlafen = to fall asleep)",
    "mädchen": "girl",
    "wirft": "throws",
    "roten": "red",
    "ball": "ball",
    "aber": "but",
    "es": "it / she (the girl)",
    "ihn": "him / it",
    "zu": "to / too",
    "weit": "far",
    "sieht": "sees",
    "läuft": "runs",
    "sofort": "immediately",
    "los": "off (losläuft = runs off)",
    "obwohl": "although",
    "ruft": "calls / shouts",
    "springt": "jumps",
    "hoch": "high",
    "luft": "air",
    "fängt": "catches",
    "maul": "mouth (of an animal)",
    "freut": "is happy (sich freuen = to be happy)",
    "sich": "(reflexive) herself / himself",
    "sehr": "very",
    "dass": "that",
    "laut": "loud(ly)",
    "bravo": "bravo / well done",
    "alle": "all",
    "anderen": "other",
    "klatschen": "clap",
    "stolz": "proud",
    "auf": "of / on",
    "seinen": "his (accusative)",
    "danach": "afterwards",
    "zusammen": "together",
    "bis": "until",
    "dunkel": "dark",
    "wird": "becomes / gets",
    "am": "at the / on the",
    "abend": "evening",
    "müde": "tired",
    "nach": "to / after",
    "hause": "home (nach Hause = (to) home)",
    "legt": "puts / lays (sich legen = to lie down)",
    "sofa": "sofa",
    "schläft": "sleeps (einschlafen = to fall asleep)",
    "lächelt": "smiles",
    "sagt": "says",
    "leise": "quietly",
    "du": "you",
    "warst": "were",
    "richtiger": "real / proper",
    "held": "hero",
    "warum": "why",
    "krank": "ill",
    "freunde": "friends",
    "besuchen": "to visit",
    "muss": "must / has to",
    "was": "what",
    "macht": "does / makes",
    "bleibt": "stays",
    "bei": "with / at",
    "bellt": "barks",
    "an": "at (anbellen = to bark at)",
    "wie": "how",
    "reagieren": "react",
    "weg": "away",
    "aus": "out (auslachen = to laugh at / mock)",
    "wer": "who",
    "ende": "end",
    "sei": "was (reported speech: sei = is/was)",
    "schlechter": "bad",
    "gewesen": "been",
    "müsse": "had to (reported speech)",
    "morgen": "tomorrow",
    "dem": "the (dative)"
  }
};
/* ===== END STORY DATA ===== */
document.getElementById('lvl').textContent = 'Niveau / Level: ' + STORY.level;

const pop = document.getElementById('pop');
const synth = window.speechSynthesis;

function speak(text) {
  if (!synth) { alert('Speech is not supported in this browser.'); return; }
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'de-DE';
  const v = synth.getVoices().find(v => v.lang && v.lang.replace('_','-').toLowerCase().startsWith('de'));
  if (v) u.voice = v;
  u.rate = 0.85;
  synth.speak(u);
}
if (synth) synth.getVoices();

// speak the whole story: one utterance per sentence, queued (avoids browser cut-offs on long text)
function speakAll() {
  if (!synth) { alert('Speech is not supported in this browser.'); return; }
  synth.cancel();
  const v = synth.getVoices().find(v => v.lang && v.lang.replace('_','-').toLowerCase().startsWith('de'));
  STORY.sentences.forEach(s => {
    const u = new SpeechSynthesisUtterance(s.de);
    u.lang = 'de-DE'; if (v) u.voice = v; u.rate = 0.85;
    synth.speak(u);
  });
}
document.getElementById('playAll').addEventListener('click', e => { e.stopPropagation(); speakAll(); });

function showPop(anchor, html) {
  pop.innerHTML = html;
  pop.style.display = 'block';
  const r = anchor.getBoundingClientRect();
  const left = Math.max(8, Math.min(r.left + scrollX, scrollX + innerWidth - pop.offsetWidth - 8));
  pop.style.left = left + 'px';
  pop.style.top = (r.bottom + scrollY + 6) + 'px';
}
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function btn(label, title, fn) {
  const b = document.createElement('button');
  b.className = 'ic'; b.textContent = label; b.title = title;
  b.addEventListener('click', e => { e.stopPropagation(); fn(b); });
  return b;
}

const main = document.getElementById('story');
STORY.sentences.forEach(s => {
  const p = document.createElement('span');
  p.className = 's';
  p.appendChild(btn('🔊', 'Satz anhören / Hear sentence', () => speak(s.de)));
  p.appendChild(btn('💬', 'English', b => showPop(b, esc(s.en))));
  // split into words (letters incl. umlauts/ß, apostrophes/hyphens inside) and everything else
  s.de.split(/([A-Za-zÄÖÜäöüß]+(?:[-'][A-Za-zÄÖÜäöüß]+)*)/).forEach(part => {
    if (!part) return;
    if (/^[A-Za-zÄÖÜäöüß]/.test(part)) {
      const key = part.toLowerCase();
      const en = STORY.glossary[key];
      if (en === undefined) console.warn('Missing glossary entry:', key);
      const w = document.createElement('span');
      w.className = 'w'; w.textContent = part;
      w.addEventListener('click', e => {
        e.stopPropagation();
        showPop(w, '<span class="de">' + esc(part) + '</span> = ' + esc(en ?? '(no translation)') + ' ');
        const sp = btn('🔊', 'Wort anhören / Hear word', () => speak(part));
        pop.appendChild(sp);
      });
      p.appendChild(w);
    } else {
      p.appendChild(document.createTextNode(part));
    }
  });
  main.appendChild(p);
});

// quiz: clicking an option reveals the correct answer with a green tick
const quiz = document.getElementById('quiz');
if (STORY.questions && STORY.questions.length) {
  const h = document.createElement('h2'); h.textContent = 'Fragen zur Geschichte'; quiz.appendChild(h);
  STORY.questions.forEach((qq, i) => {
    const box = document.createElement('div'); box.className = 'q';
    const p = document.createElement('p'); p.textContent = (i + 1) + '. ' + qq.q; box.appendChild(p);
    const btns = qq.options.map((o, j) => {
      const b = document.createElement('button'); b.className = 'opt'; b.textContent = o;
      b.addEventListener('click', e => {
        e.stopPropagation();
        btns.forEach((x, k) => {
          x.disabled = true;
          if (k === qq.answer) { x.classList.add('correct'); x.insertAdjacentHTML('afterbegin', '<span class="tick">✔</span>'); }
        });
        if (j !== qq.answer) b.classList.add('wrong');
      });
      box.appendChild(b); return b;
    });
    quiz.appendChild(box);
  });
}

document.addEventListener('click', () => { pop.style.display = 'none'; });
pop.addEventListener('click', e => e.stopPropagation());
</script>
</body>
</html>
