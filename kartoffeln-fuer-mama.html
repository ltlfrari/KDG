<body>

<script>
/* ===== STORY DATA (edit this block when updating a story) ===== */
const STORY = {

  titleEn: "Potatoes for Mum",
  sentences: [
    {"de":"Tom ist sieben Jahre alt und möchte seiner Mutter gern helfen.","en":"Tom is seven years old and would like to help his mother."},
    {"de":"Heute Nachmittag gibt seine Mutter ihm fünf Euro und sagt: „Fahr bitte mit dem Bus zum Supermarkt und kauf Kartoffeln.“","en":"This afternoon his mother gives him five euros and says: \"Please take the bus to the supermarket and buy potatoes.\""},
    {"de":"„Ich brauche die Kartoffeln, weil ich heute Abend Kartoffelsalat machen will.“","en":"\"I need the potatoes because I want to make potato salad this evening.\""},

    {"de":"Als der Bus endlich kommt, steigt er ein und setzt sich ans Fenster.","en":"When the bus finally comes, he gets on and sits down by the window."},
    {"de":"Er hat ein bisschen Angst, dass er die richtige Haltestelle verpasst.","en":"He is a little afraid that he will miss the right stop."},
    {"de":"Zum Glück sieht er den Supermarkt schon von weitem und drückt auf den Knopf.","en":"Luckily he sees the supermarket from far away and presses the button."},
    {"de":"Im Laden sucht er lange, bis er die Kartoffeln findet.","en":"In the shop he searches for a long time until he finds the potatoes."},
    {"de":"Er nimmt einen Sack, geht zur Kasse und bezahlt.","en":"He takes a sack, goes to the checkout and pays."},
    {"de":"Die Verkäuferin lächelt und sagt, dass er das sehr gut gemacht hat.","en":"The shop assistant smiles and says that he did that very well."},
    {"de":"Mit der schweren Tüte fährt er wieder zurück nach Hause.","en":"With the heavy bag he rides back home again."},
    {"de":"Seine Mutter wartet schon an der Tür und umarmt ihn.","en":"His mother is already waiting at the door and hugs him."},
    {"de":"„Danke, Tom, du bist wirklich ein großer Helfer!“","en":"\"Thank you, Tom, you really are a great helper!\""},
    {"de":"Am Abend sitzen sie zusammen am Tisch und essen den leckeren Kartoffelsalat.","en":"In the evening they sit together at the table and eat the delicious potato salad."}
  ],
  questions: [
    {"q":"Warum soll Tom Kartoffeln kaufen?","options":["Weil seine Mutter Kartoffelsalat machen will","Weil er selbst Hunger hat","Weil der Vater sie braucht"],"answer":0},
    {"q":"Wovor hat Tom ein bisschen Angst?","options":["Vor dem Busfahrer","Dass er die Haltestelle verpasst","Dass das Geld nicht reicht"],"answer":1},
    {"q":"Was sagt die Verkäuferin?","options":["Dass Tom zu klein ist","Dass er mehr Geld braucht","Dass er das sehr gut gemacht hat"],"answer":2},
    {"q":"Was machen Tom und seine Mutter am Abend?","options":["Sie gehen ins Restaurant","Sie essen zusammen Kartoffelsalat","Sie fahren mit dem Bus"],"answer":1}
  ],
  glossary: {

    "heute": "today",

    "gibt": "gives",

    "euro": "euro(s)",
    "sagt": "says",

    "bis": "until",
    "findet": "finds",

    "einen": "a (masc., accusative)",
    "sack": "sack",
    "kasse": "checkout",

    "ihn": "him",
    "danke": "thank you",
    "du": "you",
    "bist": "are",
    "wirklich": "really",
    "großer": "great / big",
    "helfer": "helper",
    "am": "in the / on the / at the",
    "sitzen": "sit",
    "zusammen": "together",
    "tisch": "table",
    "essen": "eat",
    "leckeren": "delicious",
    "warum": "why",
    "soll": "is supposed to / should",
    "kaufen": "to buy",
    "selbst": "himself / himself (emphasis)",
    "hunger": "hunger",
    "vater": "father",
    "braucht": "needs",
    "wovor": "of what",
    "vor": "of / before (Angst vor = afraid of)",
    "busfahrer": "bus driver",
    "reicht": "is enough",
    "nicht": "not",
    "was": "what",
    "zu": "too / to",
    "klein": "small",
    "mehr": "more",
    "gehen": "go",
    "restaurant": "restaurant",
    "ins": "into the",
    "fahren": "ride / travel",
    "wo": "where"
  }
};
/* ===== END STORY DATA ===== */
document.getElementById('lvl').textContent = 'Niveau / Level: ' + STORY.level;

const pop = document.getElementById('pop');
const synth = window.speechSynthesis;

// Speech with pauses at punctuation: text is split into chunks at , ; : – — . ! ? and each chunk is
// spoken as its own utterance; a silent gap (setTimeout) follows each chunk (short for commas, longer for sentence ends).
const PAUSE = { ',': 100, ';': 250, ':': 250, '–': 250, '—': 250, '.': 300, '!': 300, '?': 300 };
const SENTENCE_GAP = 650;
let speechToken = 0;

function germanVoice() {
  return synth.getVoices().find(v => v.lang && v.lang.replace('_','-').toLowerCase().startsWith('de'));
}
function chunks(text) {
  const out = [];
  const re = /([^,;:–—.!?]+)([,;:–—.!?„“"»«]*)/g;
  let m;
  while ((m = re.exec(text))) {
    const words = m[1].replace(/[„“"»«]/g, '').trim();
    const punct = (m[2].match(/[,;:–—.!?]/g) || []).pop();
    if (words) out.push({ text: words, pause: punct ? PAUSE[punct] : 0 });
    else if (punct && out.length) out[out.length - 1].pause = Math.max(out[out.length - 1].pause, PAUSE[punct]);
  }
  return out;
}
function speakQueue(items) {   // items: [{text, pause}]
  const token = ++speechToken;
  const v = germanVoice();
  let i = 0;
  (function next() {
    if (token !== speechToken || i >= items.length) return;
    const it = items[i++];
    const u = new SpeechSynthesisUtterance(it.text);
    u.lang = 'de-DE'; if (v) u.voice = v; u.rate = 0.85;
    const go = () => setTimeout(next, it.pause);
    u.onend = go; u.onerror = go;
    synth.speak(u);
  })();
}
function speak(text) {
  if (!synth) { alert('Speech is not supported in this browser.'); return; }
  synth.cancel();
  speakQueue(chunks(text));
}
if (synth) synth.getVoices();

// speak the whole story: sentence by sentence, with pauses at punctuation and a longer gap between sentences
function speakAll() {
  if (!synth) { alert('Speech is not supported in this browser.'); return; }
  synth.cancel();
  const items = [];
  STORY.sentences.forEach(s => {
    const c = chunks(s.de);
    if (c.length) c[c.length - 1].pause = Math.max(c[c.length - 1].pause, SENTENCE_GAP);
    items.push(...c);
  });
  speakQueue(items);
}
document.getElementById('playAll').addEventListener('click', e => { e.stopPropagation(); speakAll(); });

function showPop(anchor, html) {
  pop.innerHTML = html;
  pop.style.display = 'block';
  const r = anchor.getBoundingClientRect();
  const left = Math.max(8, Math.min(r.left + scrollX, scrollX + innerWidth - pop.offsetWidth - 8));
  pop.style.left = left + 'px';
  pop.style.top = (r.bottom + scrollY + 6) + 'px';
}
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function btn(label, title, fn) {
  const b = document.createElement('button');
  b.className = 'ic'; b.textContent = label; b.title = title;
  b.addEventListener('click', e => { e.stopPropagation(); fn(b); });
  return b;
}

const main = document.getElementById('story');
STORY.sentences.forEach(s => {
  const p = document.createElement('span');
  p.className = 's';
  p.appendChild(btn('🔊', 'Satz anhören / Hear sentence', () => speak(s.de)));
  p.appendChild(btn('💬', 'English', b => showPop(b, esc(s.en))));
  // split into words (letters incl. umlauts/ß, apostrophes/hyphens inside) and everything else
  s.de.split(/([A-Za-zÄÖÜäöüß]+(?:[-'][A-Za-zÄÖÜäöüß]+)*)/).forEach(part => {
    if (!part) return;
    if (/^[A-Za-zÄÖÜäöüß]/.test(part)) {
      const key = part.toLowerCase();
      const en = STORY.glossary[key];
      if (en === undefined) console.warn('Missing glossary entry:', key);
      const w = document.createElement('span');
      w.className = 'w'; w.textContent = part;
      w.addEventListener('click', e => {
        e.stopPropagation();
        showPop(w, '<span class="de">' + esc(part) + '</span> = ' + esc(en ?? '(no translation)') + ' ');
        const sp = btn('🔊', 'Wort anhören / Hear word', () => speak(part));
        pop.appendChild(sp);
      });
      p.appendChild(w);
    } else {
      p.appendChild(document.createTextNode(part));
    }
  });
  main.appendChild(p);
});

// quiz: clicking an option reveals the correct answer with a green tick
const quiz = document.getElementById('quiz');
if (STORY.questions && STORY.questions.length) {
  const h = document.createElement('h2'); h.textContent = 'Fragen zur Geschichte'; quiz.appendChild(h);
  STORY.questions.forEach((qq, i) => {
    const box = document.createElement('div'); box.className = 'q';
    const p = document.createElement('p'); p.textContent = (i + 1) + '. ' + qq.q; box.appendChild(p);
    const btns = qq.options.map((o, j) => {
      const b = document.createElement('button'); b.className = 'opt'; b.textContent = o;
      b.addEventListener('click', e => {
        e.stopPropagation();
        btns.forEach((x, k) => {
          x.disabled = true;
          if (k === qq.answer) { x.classList.add('correct'); x.insertAdjacentHTML('afterbegin', '<span class="tick">✔</span>'); }
        });
        if (j !== qq.answer) b.classList.add('wrong');
      });
      box.appendChild(b); return b;
    });
    quiz.appendChild(box);
  });
}

document.addEventListener('click', () => { pop.style.display = 'none'; });
pop.addEventListener('click', e => e.stopPropagation());
</script>
</body>
</html>
