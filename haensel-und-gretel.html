<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hänsel und Gretel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lora:ital@0;1&display=swap" rel="stylesheet">
  <style>
    body { margin:0; padding:0 16px 4rem; background:#faf6ee; color:#2b2b2b; font-family:"Lora",Georgia,serif; }
    header { text-align:center; padding:2rem 0 1rem; }
    h1 { font-family:"Playfair Display",Georgia,serif; font-size:2.5rem; margin:0 0 .4rem; }
    .sub { font-style:italic; font-size:1.25rem; color:#6b5b4b; margin:0; }
    .lvl { display:inline-block; margin:.6rem 0 0; font-size:.95rem; font-weight:bold; color:#6b3f1d; background:#f1dfb8; border-radius:999px; padding:.1rem .8rem; }
    .back { display:block; text-align:center; margin:.5rem 0 1.5rem; color:#6b5b4b; }
    main { max-width:42rem; margin:0 auto; font-size:1.3rem; line-height:2.2; }
    .s { display:block; margin-bottom:.6rem; }
    .ic { cursor:pointer; border:0; background:none; font-size:1.05rem; padding:0 .2rem; vertical-align:middle; }
    .ic:hover { transform:scale(1.2); }
    .all { display:block; margin:0 auto 1rem; font-size:1.1rem; cursor:pointer; border:1px solid #c9b79c; background:#fff; border-radius:999px; padding:.3rem 1rem; }
    .all:hover { background:#f1dfb8; }
    #quiz { max-width:42rem; margin:2.5rem auto 0; font-size:1.15rem; }
    #quiz h2 { font-family:"Playfair Display",Georgia,serif; text-align:center; }
    .q { margin:1.4rem 0; }
    .q p { font-weight:bold; margin:0 0 .4rem; }
    .opt { display:block; width:100%; text-align:left; font:inherit; cursor:pointer; background:#fff; border:1px solid #c9b79c; border-radius:8px; padding:.45rem .8rem; margin:.3rem 0; }
    .opt:hover:not(:disabled) { background:#f1dfb8; }
    .opt:disabled { cursor:default; color:inherit; }
    .opt.correct { border-color:#2e9e4f; background:#eaf7ee; }
    .opt.wrong { border-color:#c0392b; background:#fbeaea; }
    .tick { color:#2e9e4f; font-weight:bold; margin-right:.4rem; }
    .w { cursor:pointer; border-radius:4px; padding:0 1px; }
    .w:hover { background:#f1dfb8; }
    #pop { position:absolute; z-index:10; display:none; background:#fff; border:1px solid #c9b79c;
           border-radius:8px; box-shadow:0 4px 14px rgba(0,0,0,.2); padding:.6rem .8rem;
           font-size:1.05rem; line-height:1.5; max-width:min(22rem,86vw); }
    #pop .de { font-weight:bold; margin-right:.3rem; }
    @media (max-width:480px){ h1{font-size:1.8rem;} main{font-size:1.15rem;} }
  </style>
</head>
<body>
  <header>
    <h1>Hänsel und Gretel</h1>
    <p class="sub">Hansel and Gretel</p>
    <p class="lvl" id="lvl"></p>
  </header>
  <a class="back" href="index.html">&larr; Alle Geschichten / All stories</a>
  <button class="all" id="playAll" title="Ganze Geschichte anhören / Hear whole story">🔊 Ganze Geschichte / Whole story</button>
  <main id="story"></main>
  <section id="quiz"></section>
  <div id="pop"></div>

<script>
/* ===== STORY DATA (edit this block when updating a story) ===== */
const STORY = {
  level: "B1",
  titleDe: "Hänsel und Gretel",
  titleEn: "Hansel and Gretel",
  sentences: [
    {"de":"Hänsel und Gretel waren Geschwister und wohnten mit ihrem Vater in einem kleinen Haus am Waldrand.","en":"Hansel and Gretel were siblings and lived with their father in a small house at the edge of the forest."},
    {"de":"Die Familie war so arm, dass sie oft nicht genug zu essen hatte.","en":"The family was so poor that they often did not have enough to eat."},
    {"de":"Eines Tages brachte der Vater die Kinder tief in den Wald und ließ sie dort allein.","en":"One day the father took the children deep into the forest and left them there alone."},
    {"de":"Die Kinder hatten großen Hunger und wussten nicht, wie sie nach Hause kommen sollten.","en":"The children were very hungry and did not know how they were supposed to get home."},
    {"de":"Nach einer langen Wanderung sahen sie plötzlich ein Häuschen, das aus Brot, Kuchen und Zucker gebaut war.","en":"After a long walk they suddenly saw a little house that was built from bread, cake and sugar."},
    {"de":"Weil sie so hungrig waren, aßen sie sofort ein Stück vom Dach.","en":"Because they were so hungry, they immediately ate a piece of the roof."},
    {"de":"Da öffnete sich die Tür, und eine alte Frau kam heraus.","en":"Then the door opened, and an old woman came out."},
    {"de":"Sie tat zuerst freundlich, aber in Wirklichkeit war sie eine böse Hexe.","en":"At first she acted friendly, but in reality she was an evil witch."},
    {"de":"Die Hexe sperrte Hänsel in einen Käfig, weil sie ihn essen wollte.","en":"The witch locked Hansel in a cage because she wanted to eat him."},
    {"de":"Gretel musste jeden Tag für die Hexe arbeiten und ihrem Bruder Essen bringen.","en":"Gretel had to work for the witch every day and bring food to her brother."},
    {"de":"Eines Tages sollte Gretel in den Ofen schauen, aber sie tat so, als würde sie nicht verstehen, wie das geht.","en":"One day Gretel was supposed to look into the oven, but she pretended she did not understand how it works."},
    {"de":"Als die Hexe es ihr zeigen wollte, schob Gretel sie schnell in den Ofen.","en":"When the witch wanted to show her, Gretel quickly pushed her into the oven."},
    {"de":"Dann befreite sie ihren Bruder, und die beiden fanden im Haus viele Schätze.","en":"Then she freed her brother, and the two found many treasures in the house."},
    {"de":"Mit den Schätzen liefen sie nach Hause, wo der Vater schon auf sie wartete.","en":"With the treasures they ran home, where their father was already waiting for them."},
    {"de":"Er freute sich sehr und versprach, die Kinder nie wieder allein zu lassen.","en":"He was very happy and promised never to leave the children alone again."},
    {"de":"Von diesem Tag an hatte die Familie keine Sorgen mehr.","en":"From that day on the family had no more worries."}
  ],
  questions: [
    {"q":"Warum hatte die Familie oft nicht genug zu essen?","options":["Weil sie sehr arm war","Weil der Vater keinen Hunger hatte","Weil es im Wald kein Brot gab"],"answer":0},
    {"q":"Woraus war das Häuschen gebaut?","options":["Aus Holz und Stein","Aus Brot, Kuchen und Zucker","Aus Eis und Schnee"],"answer":1},
    {"q":"Warum sperrte die Hexe Hänsel in einen Käfig?","options":["Weil er das Dach gegessen hatte","Weil er weglaufen wollte","Weil sie ihn essen wollte"],"answer":2},
    {"q":"Wie rettete Gretel ihren Bruder?","options":["Sie schob die Hexe in den Ofen","Sie rief den Vater zu Hilfe","Sie bezahlte die Hexe"],"answer":0}
  ],
  glossary: {
    "hänsel": "Hansel (name)",
    "und": "and",
    "gretel": "Gretel (name)",
    "waren": "were",
    "geschwister": "siblings",
    "wohnten": "lived (resided)",
    "mit": "with",
    "ihrem": "their / her (dative)",
    "vater": "father",
    "in": "in / into",
    "einem": "a (dative)",
    "kleinen": "small",
    "haus": "house",
    "am": "at the / on the",
    "waldrand": "edge of the forest",
    "die": "the (fem./plural)",
    "familie": "family",
    "war": "was",
    "so": "so",
    "arm": "poor",
    "dass": "that",
    "sie": "they / she / them",
    "oft": "often",
    "nicht": "not",
    "genug": "enough",
    "zu": "to / too",
    "essen": "eat / food",
    "hatte": "had",
    "eines": "one (eines Tages = one day)",
    "tages": "day (eines Tages = one day)",
    "brachte": "brought / took",
    "der": "the (masc.)",
    "kinder": "children",
    "tief": "deep",
    "den": "the (accusative / dative plural)",
    "wald": "forest",
    "ließ": "left / let (lassen)",
    "dort": "there",
    "allein": "alone",
    "hatten": "had",
    "großen": "great / big",
    "hunger": "hunger",
    "wussten": "knew",
    "wie": "how",
    "nach": "to / after",
    "hause": "home (nach Hause = (to) home)",
    "kommen": "come / get",
    "sollten": "were supposed to / should",
    "einer": "a (dative fem.)",
    "langen": "long",
    "wanderung": "walk / hike",
    "sahen": "saw",
    "plötzlich": "suddenly",
    "ein": "a",
    "häuschen": "little house",
    "das": "the (neut.) / that (relative)",
    "aus": "out of / made of",
    "brot": "bread",
    "kuchen": "cake",
    "zucker": "sugar",
    "gebaut": "built",
    "weil": "because",
    "hungrig": "hungry",
    "aßen": "ate",
    "sofort": "immediately",
    "stück": "piece",
    "vom": "of the / from the",
    "dach": "roof",
    "da": "then",
    "öffnete": "opened",
    "sich": "(reflexive) itself",
    "tür": "door",
    "eine": "a (fem.)",

    "frau": "woman",

    "bruder": "brother",

    "ofen": "oven",
    "als": "when / as",
    "würde": "would",

    "es": "it",

    "schob": "pushed",

    "beiden": "both (the two)",
    "fanden": "found",
    "im": "in the",
    "viele": "many",
    "schätze": "treasures",
    "schätzen": "treasures (dative plural)",
    "liefen": "ran",
    "wo": "where",
    "schon": "already",
    "auf": "for / on (warten auf = to wait for)",
    "wartete": "waited",
    "er": "he",
    "freute": "was glad (sich freuen = to be happy)",
    "sehr": "very",
    "versprach": "promised",
    "nie": "never",
    "wieder": "again",
    "lassen": "to leave / let",
    "von": "from",
    "diesem": "this (dative)",
    "an": "on (von diesem Tag an = from that day on)",
    "keine": "no",
    "sorgen": "worries",
    "mehr": "more",
    "warum": "why",
    "keinen": "no (masc., accusative)",
    "gab": "gave (es gab = there was)",
    "woraus": "from what / made of what",
    "holz": "wood",
    "stein": "stone",
    "eis": "ice",
    "schnee": "snow",
    "gegessen": "eaten",
    "weglaufen": "to run away",
    "rettete": "rescued",
    "rief": "called",
    "hilfe": "help (zu Hilfe rufen = to call for help)",
    "bezahlte": "paid",
    "dem": "the (dative)",
    "wer": "who"
  }
};
/* ===== END STORY DATA ===== */
document.getElementById('lvl').textContent = 'Niveau / Level: ' + STORY.level;

const pop = document.getElementById('pop');
const synth = window.speechSynthesis;

function speak(text) {
  if (!synth) { alert('Speech is not supported in this browser.'); return; }
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'de-DE';
  const v = synth.getVoices().find(v => v.lang && v.lang.replace('_','-').toLowerCase().startsWith('de'));
  if (v) u.voice = v;
  u.rate = 0.85;
  synth.speak(u);
}
if (synth) synth.getVoices();

// speak the whole story: one utterance per sentence, queued (avoids browser cut-offs on long text)
function speakAll() {
  if (!synth) { alert('Speech is not supported in this browser.'); return; }
  synth.cancel();
  const v = synth.getVoices().find(v => v.lang && v.lang.replace('_','-').toLowerCase().startsWith('de'));
  STORY.sentences.forEach(s => {
    const u = new SpeechSynthesisUtterance(s.de);
    u.lang = 'de-DE'; if (v) u.voice = v; u.rate = 0.85;
    synth.speak(u);
  });
}
document.getElementById('playAll').addEventListener('click', e => { e.stopPropagation(); speakAll(); });

function showPop(anchor, html) {
  pop.innerHTML = html;
  pop.style.display = 'block';
  const r = anchor.getBoundingClientRect();
  const left = Math.max(8, Math.min(r.left + scrollX, scrollX + innerWidth - pop.offsetWidth - 8));
  pop.style.left = left + 'px';
  pop.style.top = (r.bottom + scrollY + 6) + 'px';
}
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function btn(label, title, fn) {
  const b = document.createElement('button');
  b.className = 'ic'; b.textContent = label; b.title = title;
  b.addEventListener('click', e => { e.stopPropagation(); fn(b); });
  return b;
}

const main = document.getElementById('story');
STORY.sentences.forEach(s => {
  const p = document.createElement('span');
  p.className = 's';
  p.appendChild(btn('🔊', 'Satz anhören / Hear sentence', () => speak(s.de)));
  p.appendChild(btn('💬', 'English', b => showPop(b, esc(s.en))));
  // split into words (letters incl. umlauts/ß, apostrophes/hyphens inside) and everything else
  s.de.split(/([A-Za-zÄÖÜäöüß]+(?:[-'][A-Za-zÄÖÜäöüß]+)*)/).forEach(part => {
    if (!part) return;
    if (/^[A-Za-zÄÖÜäöüß]/.test(part)) {
      const key = part.toLowerCase();
      const en = STORY.glossary[key];
      if (en === undefined) console.warn('Missing glossary entry:', key);
      const w = document.createElement('span');
      w.className = 'w'; w.textContent = part;
      w.addEventListener('click', e => {
        e.stopPropagation();
        showPop(w, '<span class="de">' + esc(part) + '</span> = ' + esc(en ?? '(no translation)') + ' ');
        const sp = btn('🔊', 'Wort anhören / Hear word', () => speak(part));
        pop.appendChild(sp);
      });
      p.appendChild(w);
    } else {
      p.appendChild(document.createTextNode(part));
    }
  });
  main.appendChild(p);
});

// quiz: clicking an option reveals the correct answer with a green tick
const quiz = document.getElementById('quiz');
if (STORY.questions && STORY.questions.length) {
  const h = document.createElement('h2'); h.textContent = 'Fragen zur Geschichte'; quiz.appendChild(h);
  STORY.questions.forEach((qq, i) => {
    const box = document.createElement('div'); box.className = 'q';
    const p = document.createElement('p'); p.textContent = (i + 1) + '. ' + qq.q; box.appendChild(p);
    const btns = qq.options.map((o, j) => {
      const b = document.createElement('button'); b.className = 'opt'; b.textContent = o;
      b.addEventListener('click', e => {
        e.stopPropagation();
        btns.forEach((x, k) => {
          x.disabled = true;
          if (k === qq.answer) { x.classList.add('correct'); x.insertAdjacentHTML('afterbegin', '<span class="tick">✔</span>'); }
        });
        if (j !== qq.answer) b.classList.add('wrong');
      });
      box.appendChild(b); return b;
    });
    quiz.appendChild(box);
  });
}

document.addEventListener('click', () => { pop.style.display = 'none'; });
pop.addEventListener('click', e => e.stopPropagation());
</script>
</body>
</html>
